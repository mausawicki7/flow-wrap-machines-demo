name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el deploy a mano desde la pestaña Actions.
  workflow_dispatch:

# Necesario para que la action pueda publicar en Pages vía OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; no cancela el que esté corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build and upload
        uses: withastro/action@v3
        with:
          # Astro 7 exige >=22.12; el default de la action es Node 20 y falla el build.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
